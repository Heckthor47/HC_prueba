<!DOCTYPE html>
<html>
<head>
    <title>Debug Capas</title>
</head>
<body>
    <h1>Debug de Capas</h1>
    <button onclick="debugHomicidios()">Debug Homicidios</button>
    <button onclick="debugParques()">Debug Parques</button>
    <button onclick="debugEscuelas()">Debug Escuelas</button>
    <div id="output"></div>

    <script>
        function debugHomicidios() {
            fetch('https://fabulous-dodol-d03b96.netlify.app/homicidios.geojson')
                .then(r => r.json())
                .then(data => {
                    console.log('=== HOMICIDIOS ===');
                    console.log('Primer feature:', data.features[0]?.properties);
                    console.log('Campos disponibles:', Object.keys(data.features[0]?.properties || {}));
                    document.getElementById('output').innerHTML += `
                        <h3>Homicidios</h3>
                        <pre>${JSON.stringify(data.features[0]?.properties, null, 2)}</pre>
                    `;
                });
        }

        function debugParques() {

        function debugEscuelas() {

                    `;
                });
        }
    </script>
</body>
</html>
